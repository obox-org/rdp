<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>密码 desc 候选句宽度实测</title>
    <style>
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei',
          'PingFang SC', sans-serif;
      }
      body {
        font-family: var(--font-family);
      }
      #probe {
        position: fixed;
        left: -10000px;
        top: 0;
        white-space: pre;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="probe"></div>
    <pre id="out"></pre>
    <script type="module">
      // 常用区在 1280 宽窗口下每条说明可用的**单行宽度** = 实测控件列宽（见 measure-common.txt）
      const CONTROL_W = 446
      const probe = document.getElementById('probe')

      const candidates = [
        '只交本机凭据管理器（cmdkey），不写 .rdp、不入库；编辑时清空即删除已存密码。',
        '只交本机凭据管理器（cmdkey），不写 .rdp / 不入库；清空即删除已存密码。',
        '只交本机凭据管理器（cmdkey），不写 .rdp / 不入库；清空即删除。',
        '只交本机凭据管理器（cmdkey），不写 .rdp，不入库；清空即删除。',
        '只交本机凭据管理器（cmdkey），不写 .rdp / 不入库，清空即删除。',
        '只交本机凭据管理器（cmdkey），不写 .rdp、不入库，清空即删除。'
      ]

      function widthOf(text) {
        probe.textContent = text
        return Math.round(probe.getBoundingClientRect().width * 100) / 100
      }

      const rows = candidates.map((text) => {
        const w = widthOf(text)
        return { text, w, margin: Math.round((CONTROL_W - w) * 100) / 100, fits: w <= CONTROL_W }
      })

      const lines = []
      lines.push('# 「密码」desc 候选句在 12px / 宿主字体栈下的单行渲染宽度')
      lines.push(`# 可用宽度 = 常用区控件列 ${CONTROL_W}px（1280 窗口宽实测）`)
      lines.push('#')
      lines.push('  fits   宽度px   余量px  文案')
      for (const r of rows) {
        lines.push(
          `  ${r.fits ? ' OK ' : ' NO '}  ${String(r.w).padStart(7)}  ${String(r.margin).padStart(7)}  ${r.text}`
        )
      }
      document.getElementById('out').textContent = lines.join('\n')
      document.title = 'DONE'
    </script>
  </body>
</html>
