<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- JS 执行前由 UA 画出的画布底色用暗色，避免白闪（不含任何色值字面量；设计 §2.7.8 E3） -->
    <meta name="color-scheme" content="dark" />
    <title>远程桌面</title>
    <script type="module" crossorigin src="./assets/index-DDiHagXg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-B8821UTg.css">
  </head>
  <body>
    <div id="app"></div>
    <!-- evidence-only: open modal, expand advanced, scroll a text input inside the accordion into view -->
    <script>
      setTimeout(function () {
        var create = document.querySelector('button[aria-label="\u65b0\u5efa\u8fde\u63a5"]')
        if (create) create.click()
        setTimeout(function () {
          var toggle = document.querySelector('.accordion__toggle')
          if (toggle) toggle.click()
          setTimeout(function () {
            var input = document.querySelector('#rdp-field-driveStoreDirect')
            if (input) input.scrollIntoView({ block: 'center' })
          }, 250)
        }, 300)
      }, 400)
    </script>  </body>
</html>
