<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>远程桌面</title>
    <script type="module" crossorigin src="./assets/index-C1ClMszZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-CSNM9guL.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      setTimeout(function () {
        var create = document.querySelector('button[aria-label="\u65b0\u5efa\u8fde\u63a5"]')
        if (create) create.click()
        setTimeout(function () {
          window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
          document.title = 'OLD-escape=' + (document.querySelector('form.modal') ? 'open' : 'closed')
        }, 300)
      }, 400)
    </script>  </body>
</html>
